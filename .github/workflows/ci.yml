name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - id: gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Each check runs even if an earlier check failed, but not after a cancel or a failed setup.
      - name: Static analysis (Detekt + ktlint)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew detekt --continue

      - name: JVM tests
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew jvmTest --continue

      - name: Coverage verification (Kover)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew koverVerify --continue

      - name: Architecture tests (Konsist)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :architecture-test:test --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
