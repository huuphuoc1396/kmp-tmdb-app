# Overrides on top of the default detekt config (buildUponDefaultConfig = true).

ktlint:
  active: true

style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/commonTest/**', '**/iosTest/**', '**/*.kts']
  MaxLineLength:
    active: true
    maxLineLength: 120

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
